<body><div class="game-shell"><div class="game-top"><h1>Among Us</h1><div class="game-actions"><a class="secondary" href="../classes.html">← g@m3s</a><button class="secondary" id="reload">Reload</button><button class="primary" id="full">Fullscreen</button></div></div><div class="game-stage"><iframe id="game" class="game-frame" src="../games/among-us.html" allow="autoplay; fullscreen; gamepad; pointer-lock" allowfullscreen></iframe></div></div><script>document.getElementById('reload').onclick=()=>document.getElementById('game').src=document.getElementById('game').src;document.getElementById('full').onclick=()=>{const f=document.getElementById('game');if(f.requestFullscreen)f.requestFullscreen();else if(f.webkitRequestFullscreen)f.webkitRequestFullscreen()};</script><script src="../site.js"></script></body></html>
