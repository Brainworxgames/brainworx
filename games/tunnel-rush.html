<!DOCTYPE HTML>
<html>
<head>
  <title>Tunnel Rush 1</title>



  <style>
    html, body {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Large green game frame */
    #game-frame {
      position: relative;

      width: min(98vw, calc(94vh * 1.6));
      height: min(94vh, calc(98vw / 1.6));
      aspect-ratio: 16 / 10;

      padding: 3px;
      box-sizing: border-box;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #00ff66 0%,
          #00e65c 18%,
          #00a94f 38%,
          #087f45 52%,
          #22ff88 72%,
          #00c853 88%,
          #00ff66 100%
        );

      overflow: hidden;
    }

    #game-content {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 19px;
      background: #000;
    }

    #renderCanvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      font-size: 0;
      border: 0;
      outline: none;
      margin: 0;
      padding: 0;
      border-radius: 19px;
    }
      65% { transform: translate(0, 15px); }
      to { transform: translate(0, -0px); }
    }

    @media (max-width: 600px) {
      #game-frame {
        width: 96vw;
        height: auto;
        aspect-ratio: 16 / 10;
        padding: 2px;
        border-radius: 16px;
      }

      #game-content,
      #renderCanvas {
        border-radius: 14px;
      }
    }
  </style>

  <script src=""></script>


</head>

<body>
  <div id="wrap">
    <div id="game-frame">
      <div id="game-content">
        <canvas id="renderCanvas" touch-action="none"></canvas>

      </div>
    </div>
  </div>

  <script src="https://749201648-319375013826385014.preview.editmysite.com/uploads/b/139890129-296476716652996764/files/tr/6main.js"></script>
  <script src=""></script>
</body>
</html>
