<!doctype html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4294926180211945" crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings</title>
<link id="siteFavicon" rel="icon" href="assets/brainworks-logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body><div class="bg-glow glow-a"></div><div class="bg-glow glow-b"></div>
<header class="header"><a class="brand-mini" href="index.html"><span class="brand-dot"></span>BrainWorks</a><nav class="header-right"><a href="classes.html">g@m3s</a><a href="settings.html" class="active-link">Settings</a></nav></header>
<main class="settings-main"><section class="settings-card"><div class="eyebrow">CUSTOMIZATION</div><h1>Settings</h1><p class="settings-note">Customize the browser tab title and icon.</p>
<label>Tab title<input id="tabTitle" type="text" maxlength="80" placeholder="BrainWorks"></label>
<label>Preset tab icons</label>
<div class="icon-presets" aria-label="Preset tab icons">
  <button type="button" class="icon-preset" data-tab-name="YouTube" data-tab-icon="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" title="Use YouTube icon"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube"><span>YouTube</span></button>
  <button type="button" class="icon-preset" data-tab-name="Google" data-tab-icon="https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/Google_Favicon_2025.svg/250px-Google_Favicon_2025.svg.png" title="Use Google icon"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/Google_Favicon_2025.svg/250px-Google_Favicon_2025.svg.png" alt="Google"><span>Google</span></button>
  <button type="button" class="icon-preset" data-tab-name="Google Drive" data-tab-icon="https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5f/Google_Drive_icon_%282026%29.svg/1280px-Google_Drive_icon_%282026%29.svg.png" title="Use Google Drive icon"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5f/Google_Drive_icon_%282026%29.svg/1280px-Google_Drive_icon_%282026%29.svg.png" alt="Google Drive"><span>Drive</span></button>
  <button type="button" class="icon-preset" data-tab-name="Google Classroom" data-tab-icon="assets/google-classroom.png" title="Use Google Classroom icon"><img src="assets/google-classroom.png" alt="Google Classroom"><span>Classroom</span></button>
</div>
<label>Custom tab icon<input id="tabIcon" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/x-icon"></label>
<p class="settings-help">Click a preset to change the tab icon immediately. Custom uploads are saved when you press Save.</p>
<div class="settings-actions"><button class="primary" id="saveSettings">Save</button><button class="secondary" id="resetSettings">Reset</button></div><div id="settingsStatus" class="status"></div></section></main><script src="site.js"></script></body></html>
